name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # all packages are arch-independent, so one SDK is enough
        branch:
          - openwrt-25.12

    steps:
      - uses: actions/checkout@v6

      - uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: x86_64-${{ matrix.branch }}
          FEEDNAME: openbox
          PACKAGES: openbox luci-app-openbox
          NO_REFRESH_CHECK: true

      - name: pack
        run: |
          tar -czf openbox_${{ matrix.branch }}.tar.gz -C bin/packages/x86_64/openbox .
          sha256sum openbox_${{ matrix.branch }}.tar.gz > openbox_${{ matrix.branch }}.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: openbox_${{ matrix.branch }}
          path: |
            openbox_${{ matrix.branch }}.tar.gz
            openbox_${{ matrix.branch }}.tar.gz.sha256

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            openbox_${{ matrix.branch }}.tar.gz
            openbox_${{ matrix.branch }}.tar.gz.sha256
