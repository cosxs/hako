name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # all packages are arch-independent, so one SDK is enough
        branch:
          - openwrt-25.12

    steps:
      - uses: actions/checkout@v6

      # a release v<version> ships both packages at that PKG_VERSION
      - if: startsWith(github.ref, 'refs/tags/v')
        name: check version
        run: |
          for makefile in hako/Makefile luci-app-hako/Makefile; do
            version=$(sed -n 's/^PKG_VERSION:=//p' "$makefile")
            if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
              echo "::error file=$makefile::PKG_VERSION $version does not match the tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

      # the SDK has no Node, so the frontend is built here into luci-app-hako
      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../luci-app-hako/root/www/hako/index.html
          # the whole checkout becomes the SDK feed, keep it free of node_modules
          rm -rf node_modules

      # the geoip-cn rule set shipped as its initial_path, the latest of
      # SagerNet/sing-geoip; the one in the repository when it cannot be had
      - name: update geoip-cn
        run: |
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/geoip-cn.srs" \
             https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs &&
             [ "$(head -c 3 "$RUNNER_TEMP/geoip-cn.srs")" = SRS ]; then
            mv "$RUNNER_TEMP/geoip-cn.srs" hako/files/rule-set/geoip-cn.srs
          else
            echo "::warning::geoip-cn.srs not updated, shipping the one in the repository"
          fi

      - uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: x86_64-${{ matrix.branch }}
          FEEDNAME: hako
          PACKAGES: hako luci-app-hako
          NO_REFRESH_CHECK: true

      - name: pack
        run: |
          tar -czf hako_${{ matrix.branch }}.tar.gz -C bin/packages/x86_64/hako .
          sha256sum hako_${{ matrix.branch }}.tar.gz > hako_${{ matrix.branch }}.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: hako_${{ matrix.branch }}
          path: |
            hako_${{ matrix.branch }}.tar.gz
            hako_${{ matrix.branch }}.tar.gz.sha256

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # the ucode, uci and libubox of OpenWrt 25.12
      LIBUBOX_REF: 7dd127841e82eb1cfb61185da37dde7b9bd9ba6d
      UCI_REF: 66127cd76c5d0bd46d5a90302cc6110f53a4e2f8
      UCODE_REF: 85922056ef7abeace3cca3ab28bc1ac2d88e31b1
      SING_BOX_VERSION: 1.14.3

    steps:
      - uses: actions/checkout@v6

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev pkg-config

      - name: build ucode
        run: |
          prefix="$RUNNER_TEMP/ucode"
          fetch() {
            git init -q "$RUNNER_TEMP/$1"
            git -C "$RUNNER_TEMP/$1" fetch -q --depth 1 "$2" "$3"
            git -C "$RUNNER_TEMP/$1" checkout -q FETCH_HEAD
          }
          build() {
            name="$1"
            shift
            cmake -S "$RUNNER_TEMP/$name" -B "$RUNNER_TEMP/$name/build" -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_RPATH="$prefix/lib" "$@"
            cmake --build "$RUNNER_TEMP/$name/build" -j"$(nproc)"
            cmake --install "$RUNNER_TEMP/$name/build"
          }
          fetch libubox https://github.com/openwrt/libubox "$LIBUBOX_REF"
          build libubox -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
          fetch uci https://github.com/openwrt/uci "$UCI_REF"
          build uci -DBUILD_LUA=OFF
          fetch ucode https://github.com/jow-/ucode "$UCODE_REF"
          # glibc 2.43 (Ubuntu 26.04) returns const from strchr() on const strings,
          # which this ucode builds with -Werror
          build ucode -DCMAKE_C_FLAGS=-Wno-error=discarded-qualifiers -DUCI_SUPPORT=ON -DUBUS_SUPPORT=OFF -DULOOP_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: install sing-box
        run: |
          mkdir -p "$RUNNER_TEMP/sing-box"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-linux-amd64.tar.gz" |
            tar -xzf - -C "$RUNNER_TEMP/sing-box" --strip-components=1
          echo "$RUNNER_TEMP/sing-box" >> "$GITHUB_PATH"

      - name: run tests
        run: tests/run.sh

  # a tag is released only when every package is built and the tests pass
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hako_*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            hako_*.tar.gz
            hako_*.tar.gz.sha256
